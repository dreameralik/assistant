<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>Dreamer</title>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <p class="eyebrow">Личный помощник</p>
        <h1>Dreamer</h1>
      </div>
      <span id="connection" class="status">Проверка связи…</span>
    </header>

    <section class="card welcome">
      <h2>Что нужно сделать?</h2>
      <p>Добавляй задачи и заметки даже без интернета.</p>
      <div class="composer">
        <input id="taskInput" type="text" placeholder="Например: купить продукты" autocomplete="off">
        <button id="addTask">Добавить</button>
      </div>
    </section>

    <section class="card">
      <div class="section-title"><h2>Задачи</h2><span id="taskCount">0</span></div>
      <ul id="taskList" class="list"></ul>
      <p id="emptyTasks" class="empty">Задач пока нет.</p>
    </section>

    <section class="card">
      <h2>Запрос облачному ИИ</h2>
      <p>Запрос сохранится на телефоне и будет отправлен позже.</p>
      <textarea id="aiInput" placeholder="Например: помоги составить план на завтра"></textarea>
      <button id="queueRequest" class="secondary">Поставить в очередь</button>
      <p id="queueInfo" class="queue-info">В очереди: 0</p>
      <ul id="queueList" class="list"></ul>
    </section>

    <section class="card">
      <h2>Заметка</h2>
      <textarea id="noteInput" placeholder="Сохрани идею или важную мысль"></textarea>
      <button id="saveNote" class="secondary">Сохранить заметку</button>
      <div id="notes" class="notes"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
